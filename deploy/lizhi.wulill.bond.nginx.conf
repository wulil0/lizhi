# nginx 站点配置：lizhi.wulill.bond（李志非官方乐迷档案站）
# 服务器路径：/etc/nginx/sites-available/lizhi.wulill.bond，软链接到 sites-enabled
# 前面是 Cloudflare 代理（*.wulill.bond 通配符记录），证书沿用 wulill.bond 的源站证书
# 网站目录里放的是 scripts/build.js 生成的 dist/ 内容

# 缓存策略按路径决定。CSS / JS / 字体的地址带 ?v=<内容哈希>，内容一变地址就变，所以可以缓存一年；
# HTML 每次都向服务器校验，保证一部署就能看到新版本。
# （用 map 而不是在各个 location 里写 add_header：location 里一旦有 add_header，server 级的安全头就全不生效了）
map $uri $lizhi_cache {
    ~*\.(css|js|woff2)$  "public, max-age=31536000, immutable";
    ~^/assets/           "public, max-age=604800";
    default              "no-cache";
}

server {
    listen 443 ssl;
    listen 80;
    server_name lizhi.wulill.bond;
    ssl_certificate     /etc/nginx/ssl/wulill.bond.crt;
    ssl_certificate_key /etc/nginx/ssl/wulill.bond.key;

    root /var/www/lizhi;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    if ($scheme = http) { return 301 https://$host$request_uri; }

    add_header Cache-Control $lizhi_cache always;
    # 安全头。CSP：脚本、样式、字体只从本站加载；style-src 允许内联是因为卡片用 style="--d:…" 错开动画；
    # media-src / connect-src 放开 https:，留给播放器连对象存储（默认关闭）。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' https:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
