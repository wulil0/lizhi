# nginx 站点配置：lizhi.wulill.bond（李志非官方乐迷档案站）
# 服务器路径：/etc/nginx/sites-available/lizhi.wulill.bond，软链接到 sites-enabled
# 前面是 Cloudflare 代理（*.wulill.bond 通配符记录），证书沿用 wulill.bond 的源站证书
server {
    listen 443 ssl;
    listen 80;
    server_name lizhi.wulill.bond;
    ssl_certificate     /etc/nginx/ssl/wulill.bond.crt;
    ssl_certificate_key /etc/nginx/ssl/wulill.bond.key;

    root /var/www/lizhi;
    index index.html;

    if ($scheme = http) { return 301 https://$host$request_uri; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # 封面图基本不变，缓存一周
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # CSS / JS 改动后需立即生效，每次向服务器校验
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
