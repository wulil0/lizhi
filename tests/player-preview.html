<!doctype html>
<meta charset="utf-8">
<title>播放器预览（开发用）</title>
<!--
  开发用：写入播放器测试配置后跳转到目标页面，方便本地或无头浏览器截图。不会部署到服务器。
  参数：base=音源地址（默认 tests/fixtures/）  to=目标页面（默认 albums.html）
        album/n/time=预置“上次播放到哪”（可选）  off=1 清除测试配置
  例：tests/player-preview.html?base=http://127.0.0.1:8790/&album=2004-jinji&n=3&time=42&to=index.html
-->
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("off")) {
    localStorage.removeItem("lizhi.player");
    sessionStorage.removeItem("lizhi.player.state");
  } else {
    localStorage.setItem("lizhi.player", JSON.stringify({ enabled: true, baseUrl: q.get("base") || "tests/fixtures/" }));
    if (q.get("album")) sessionStorage.setItem("lizhi.player.state", JSON.stringify({ albumId: q.get("album"), n: +(q.get("n") || 1), time: +(q.get("time") || 0) }));
  }
  location.replace("../" + (q.get("to") || "albums.html"));
</script>
